services:
  contextgraph:
    build: .
    ports:
      - "8000:8000"
      - "8501:8501"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - UPLOAD_DIR=/app/uploads
      - DEMO_DATA_DIR=/app/demo_data
      - GRAPH_STATE_PATH=/app/data/graph_state.json
      - GRAPH_BACKEND=neo4j
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=contextgraph-password
    depends_on:
      neo4j:
        condition: service_healthy
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/contextgraph-password
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p contextgraph-password 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
